name: Backend Protection

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  backend-protection:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect unauthorized backend changes
        env:
          PR_USER: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOWED_USER: "F1894125"
        shell: bash
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^backend/'; then
            if [ "$PR_USER" != "$ALLOWED_USER" ]; then
              echo "Backend files may only be changed by $ALLOWED_USER."
              echo "Unauthorized PR author: $PR_USER"
              exit 1
            fi
          fi

          echo "Backend protection check passed."