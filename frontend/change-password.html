                  <!-- eye on -->

                <path d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                    </button>
