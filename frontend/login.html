<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Aos Animation CDN -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <!-- Swiper CSS CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <!-- Slick CSS CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"
    />
    <!-- Fancybox CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.css"
    />
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- Fontawesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Favicon -->
    <link rel="shortcut icon" href="Images/favicon.ico" type="image/x-icon" />
    <title>LogIn-Fur & Feather</title>
  </head>

  <body
    class="font-[family-name:--font-poppins] text-xl font-semibold text-[#0A303A]"
  >
    <section class="bg-[#F4F1EA] relative overflow-hidden">
      <div>
        <img
          src="Images/left-frame.png"
          class="hidden relative lg:block lg:w-[426px] xl:w-[41%] lg:min-h-[824px] 2xl:w-[960px] object-fill xl:min-h-[915px] 2xl:min-h-[1098px] min-[1920px]:min-h-screen"
          alt="left-frame"
          loading="lazy"
        />
            <!-- Cat vector -->
            <div>
              <img
                src="Images/cat-vector.png"
                alt=""
                class="absolute z-10 lg:left-[34px] lg:top-[31px] xl:left-[57px] xl:top-[45px] 2xl:left-[107px] 2xl:top-[57px] lg:w-[65px] xl:w-[75px] 2xl:w-[85px] object-contain"
              />
            </div>
      </div>
      
      <div class="grid grid-cols-12 gap-10">
      <!-- Left -->
       <div class="col-span-7">
        <div class="absolute z-20 inset-0">
        <!-- headings -->
              <div
                class="flex flex-wrap gap-4 lg:pt-[60px] lg:ps-[144px] xl:pt-[100px] xl:ps-[210px] 2xl:pt-[108px] 2xl:ps-[273px]"
              >
                <h2
                  class="font-[family-name:--font-Fredoka] font-bold text-[--primary-color-1] leading-none lg:text-[50px] xl:text-[60px] 2xl:text-[70px] min-[1920px]:text-[80px]"
                >
                  Welcome
                </h2>
                <img
                  src="Images/arrow.png"
                  alt=""
                  class="mt-[20px] w-[109px] select-none object-contain"
                  loading="lazy"
                />
              </div>
              <h4
                class="mt-[10px] lg:ms-[189px] xl:ms-[254px] 2xl:ms-[323px] font-[family-name:--font-Fredoka] font-bold text-[--primary-color-1] leading-none lg:text-[36px] xl:text-[50px] 2xl:text-[70px]"
              >
                Back <span class="text-brand text-[--btn-color]">Friend!</span>
              </h4>
              <!-- Subtitle -->
              <p
                class="mt-[35px] lg:max-w-[450px] xl:max-w-[597px] 2xl:max-w-[744px] lg:ms-[83px] xl:ms-[79px] 2xl:ms-[102px] max-[1920px]:ms-[149px] text-center font-[family-name:--font-poppins] font-semibold leading-[1.55] lg:text-sm xl:text-xl 2xl:text-2xl"
              >
                Welcome back! Continue exploring
                <span class="text-brand text-[--btn-color]"
                  >loving companions</span
                >
                and make every login the start of a
                <span class="text-brand text-[--btn-color]"
                  >new friendship.</span
                >
              </p>
              <!-- Heart -->
              <div>
                <img
                  src="Images/heart.png"
                  class="heart absolute z-30 right-1/2 -translate-x-1/2 lg:w-[40px] 2xl:w-[60px] lg:mt-[44px] xl:mt-[119px] 2xl:mt-[76px] object-contain"
                  alt="heart"
                  loading="lazy"
                />
</div>
<!-- red vector and dog -->
                <div>
                  <img
                    src="Images/red-vector.svg"
                    class="absolute z-30 object-contain lg:w-[410px] lg:mt-[80px] lg:ms-24 xl:w-[550px] xl:mt-[135px] 2xl:ms-[60px] min-[1920px]:mt-[184px] min-[1920px]:ms-[100px] xl:ms-[40px] 2xl:ms-[127px] 2xl:w-[744px]"
                    alt="red-vector"
                    loading="lazy"
                  />
                  <img
                    src="Images/dog.png"
                    alt="dog"
                    class="absolute z-40 object-contain xl:mt-[14px] xl:ms-[19px] 2xl:mt-[11px] min-[1920px]:mt-[44px] 2xl:ms-[60px] min-[1920px]:ms-[93px] lg:w-[44%] lg:mt-[34px] lg:ms-[86px] 2xl:w-[744px]"
                    loading="lazy"
                  />
                </div>
                <!-- Banner-dog -->
              <div>
                <img
                  src="Images/banner-right-dog.png"
                  class="absolute z-10 lg:top-[224px] xl:top-[256px] 2xl:top-[385px] lg:w-[160px] xl:w-fit"
                  alt="right-dog"
                  loading="lazy"
                />
              </div>
              <!-- Paw -->
              <img
                src="Images/paw.png"
                alt="paw"
                class="absolute z-[999] xl:left-[30px] lg:top-[78%] xl:top-[87%] 2xl:left-[35px] min-[1920px]:left-[61px] w-[138px] object-contain lg:w-[100px] 2xl:w-[150px] lg:left-[50px]"
              />
<!-- blue vector -->
              <div>
                <img
                  src="Images/blue vector.svg"
                  class="object-contain absolute z-30 bottom-0 xl:left-[26%] 2xl:left-[27%] min-[1920px]:left-[21%] lg:w-[40%] lg:left-[20%] xl:w-[30%]"
                  alt="blue-vector"
                  loading="lazy"
                />
                <div
                  class="absolute z-40 bottom-0 lg:left-[39%] xl:left-[42%] 2xl:left-[43%] min-[1920px]:left-[36%] "
                >
                  <img
                    src="Images/bone.png"
                    class="object-contain -ms-[50px] lg:w-[60%]"
                    alt="bone"
                    loading="lazy"
                  />
                  <img
                    src="Images/bone.png"
                    class="object-contain lg:w-[60%]"
                    alt="bone"
                    loading="lazy"
                  />
                </div>
              </div>

              </div>

       </div>
       <!-- Right -->
        <div class="absolute z-10 top-0 right-0">
        <img
          src="Images/Right-login-frame.png"
          class="hidden lg:block lg:w-[490px] xl:w-[650px] 2xl:w-[739px] min-[1920px]:w-[970px] lg:min-h-[1400px] object-fill"
          alt=""
          loading="lazy"
        />
        <div class="col-span-5">
        <!-- <div class="login-banner"> -->
          <div
  class="w-full max-w-full
         min-h-screen"
>
<div class="lg:absolute lg:top-0 lg:z-20 lg:right-[52px] xl:right-[70px] pr-4">
              <div
                  class="pt-4 lg:pt-5"
                >
                  <a
                    href="login.html"
                    class="block mx-auto w-[250px] sm:w-[260px] md:w-[280px] lg:w-[300px] xl:w-[350px] 2xl:w-[400px] min-[1920px]:w-full object-contain"
                  >
                    <img
                      src="Images/Logo  for bright bg.png"
                      class="mx-auto w-[250px] sm:w-[260px] md:w-[280px] lg:w-[300px] xl:w-[350px] 2xl:w-[400px] min-[1920px]:w-full object-contain"
                    />
                  </a>
                </div>
                <h1
                class="mt-0 lg:mt-[21px] max-w-[648px] font-[family-name:--font-Fredoka] font-bold text-[--primary-color-1] leading-none text-center font-bold leading-tight text-xl lg:text-2xl xl:text-3xl 2xl:text-4xl min-[1920px]:text-5xl text-center mx-auto"
              >
                Welcome Back To
                <span class="text-brand text-[--btn-color]">Compassion</span>
              </h1>
<!-- </div> -->
</div>
</div>
       </div>
      </div>
       
      </div>
    </section>

    <!-- AOS Animation -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Swiper JS CDN  -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <!-- JQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <!-- Fancybox JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.umd.js"></script>
    <!-- External Javascript CDN -->
    <script src="script.js"></script>
    <script>
      Fancybox.bind("[data-fancybox]", {
        // Your custom options
      });
    </script>
  </body>
</html>
